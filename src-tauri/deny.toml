# cargo-deny supply-chain policy for the Lucerna crate.
#
# Enforced in CI (`cargo deny check`, see .github/workflows/ci.yml) on every
# push/PR, and the mechanical backing for the CLAUDE.md rule "no new crate
# dependency without cargo-deny justification". Four checks: security
# advisories (the cargo-audit equivalent — RustSec DB), banned/duplicate
# crates, license policy, and the crate-source allowlist.

[advisories]
# RustSec advisory database. A new advisory against any dependency fails CI;
# add a justified entry to `ignore` (with the RUSTSEC id + a comment) only when
# the advisory is assessed as not applicable to how Lucerna uses the crate.
version = 2
yanked = "deny"
# Most entries below are `unmaintained` advisories on a DEEP TRANSITIVE
# dependency we do not control and cannot upgrade, grouped by the upstream that
# pulls them in. The ONE exception to "never ignore a vulnerability" is the
# quick-xml build-dependency block at the end: our runtime quick-xml is patched
# (>= 0.41.0); those two IDs flag only a build-time-only copy with no upstream
# fix (see the block comment). A genuinely new advisory — any other
# vulnerability, or an unmaintained flag on a crate not listed here — still
# fails CI and gets reviewed. Re-evaluate this list on Tauri upgrades.
ignore = [
  # rust-unic family (open-i18n/rust-unic, all unmaintained, "no safe upgrade").
  # Pulled in via tauri -> tauri-utils -> urlpattern -> unic-*.
  "RUSTSEC-2025-0075", # unic-char-range
  "RUSTSEC-2025-0080", # unic-common
  "RUSTSEC-2025-0081", # unic-char-property
  "RUSTSEC-2025-0098", # unic-ucd-version
  "RUSTSEC-2025-0100", # unic-ucd-ident
  # gtk-rs GTK3 bindings (unmaintained; upstream points to gtk4-rs). Pulled in
  # via tauri's Linux webkit2gtk stack — Tauri 2 still targets GTK3.
  "RUSTSEC-2024-0411", # gtk
  "RUSTSEC-2024-0412", # atk
  "RUSTSEC-2024-0413", # gdk
  "RUSTSEC-2024-0414", # gdkx11
  "RUSTSEC-2024-0415", # gdkwayland / gtk-sys family
  "RUSTSEC-2024-0416", # gdk-pixbuf
  "RUSTSEC-2024-0417", # atk-sys
  "RUSTSEC-2024-0418", # gdk-sys
  "RUSTSEC-2024-0419", # gtk3-macros
  "RUSTSEC-2024-0420", # gdkx11-sys
  # Unmaintained proc-macro ecosystem crates, transitive via build deps.
  "RUSTSEC-2024-0370", # proc-macro-error
  "RUSTSEC-2024-0436", # paste
  # ── Build-dependency-only quick-xml DoS (the "never ignore a vuln" exception) ──
  # Our RUNTIME quick-xml is pinned to >= 0.41.0 (patched — see Cargo.toml). These
  # two flag ONLY the copy pulled at BUILD time by `plist`
  # (tauri-build -> tauri-utils -> plist), which parses our own generated macOS
  # Info.plist during bundling — never attacker-controlled input, never shipped in
  # the binary. plist 1.9.0 (latest) still requires quick-xml ^0.39 and cannot take
  # 0.41, so there is no upstream fix yet. REMOVE both when plist ships a
  # quick-xml >= 0.41 build (or the runtime dep gains a second, untrusted XML path).
  "RUSTSEC-2026-0194", # quick-xml quadratic start-tag attrs — build-dep (plist) only
  "RUSTSEC-2026-0195", # quick-xml unbounded NsReader namespaces — build-dep (plist) only
]

[bans]
# Duplicate versions of the same crate are bloat, not a correctness bug — warn
# (a transitive diamond is usually out of our hands). Wildcard version reqs are
# non-reproducible and forbidden.
multiple-versions = "warn"
wildcards = "deny"
allow = []
deny = []

[licenses]
version = 2
# Permissive + weak-copyleft (MPL) licenses acceptable for a distributed,
# source-available desktop app. A dependency under any other license fails CI;
# resolve by dropping the crate or adding a per-crate `exceptions` entry with a
# justification, not by widening this list reflexively.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "CC0-1.0",
  "BSL-1.0",
  "Unlicense",
  # webpki-root-certs ships the Mozilla CA bundle under a permissive data license
  # (pulled in via reqwest -> rustls-platform-verifier).
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
# "OpenSSL" is deliberately NOT in the allowlist above. It sat there globally
# from the first version of this file (#85), when the rustls crypto provider
# (aws-lc-sys) still declared it; the current lockfile no longer does —
# aws-lc-sys 0.41.0 declares its OpenSSL-derived code as Apache-2.0, and
# ring 0.17.14 declares `Apache-2.0 AND ISC`. The OpenSSL license is
# GPL-incompatible (advertising clause), and this binary is GPL-3.0-or-later:
# a global allow would let any NEW dependency link OpenSSL-licensed code into
# it without review. If a future dependency bump reintroduces an OpenSSL
# declaration, scope it to that one crate as an `exceptions` entry (e.g.
# `{ allow = ["OpenSSL"], crate = "aws-lc-sys" }`) together with a written
# resolution of the GPL question — a linking permission from the copyright
# holder, or a crypto provider without OpenSSL-licensed code — never by
# re-adding the global allow.
exceptions = [
  # Lucerna itself is GPL-3.0-or-later. The allowlist above governs DEPENDENCY
  # licenses; this scoped exception permits our own crate's copyleft license
  # without admitting GPL-licensed dependencies.
  { allow = ["GPL-3.0-or-later"], crate = "lucerna" },
]

[sources]
# Crates must come from crates.io; an unknown registry or git source fails CI.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
