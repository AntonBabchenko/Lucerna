# cargo-deny supply-chain policy for the Lucerna crate.
#
# Enforced in CI (`cargo deny check`, see .github/workflows/ci.yml) on every
# push/PR, and the mechanical backing for the CLAUDE.md rule "no new crate
# dependency without cargo-deny justification". Four checks: security
# advisories (the cargo-audit equivalent — RustSec DB), banned/duplicate
# crates, license policy, and the crate-source allowlist.

[advisories]
# RustSec advisory database. A new advisory against any dependency fails CI;
# add a justified entry to `ignore` (with the RUSTSEC id + a comment) only when
# the advisory is assessed as not applicable to how Lucerna uses the crate.
version = 2
yanked = "deny"
# Every entry below is an `unmaintained` advisory (NOT a vulnerability —
# cargo-deny checks vulnerabilities independently and they are never ignored)
# on a DEEP TRANSITIVE dependency we do not control and cannot upgrade. They
# are grouped by the upstream that pulls them in. A genuinely new advisory —
# any vulnerability, or an unmaintained flag on a crate not listed here — still
# fails CI and gets reviewed. Re-evaluate this list on Tauri upgrades.
ignore = [
  # rust-unic family (open-i18n/rust-unic, all unmaintained, "no safe upgrade").
  # Pulled in via tauri -> tauri-utils -> urlpattern -> unic-*.
  "RUSTSEC-2025-0075", # unic-char-range
  "RUSTSEC-2025-0080", # unic-common
  "RUSTSEC-2025-0081", # unic-char-property
  "RUSTSEC-2025-0098", # unic-ucd-version
  "RUSTSEC-2025-0100", # unic-ucd-ident
  # gtk-rs GTK3 bindings (unmaintained; upstream points to gtk4-rs). Pulled in
  # via tauri's Linux webkit2gtk stack — Tauri 2 still targets GTK3.
  "RUSTSEC-2024-0411", # gtk
  "RUSTSEC-2024-0412", # atk
  "RUSTSEC-2024-0413", # gdk
  "RUSTSEC-2024-0414", # gdkx11
  "RUSTSEC-2024-0415", # gdkwayland / gtk-sys family
  "RUSTSEC-2024-0416", # gdk-pixbuf
  "RUSTSEC-2024-0417", # atk-sys
  "RUSTSEC-2024-0418", # gdk-sys
  "RUSTSEC-2024-0419", # gtk3-macros
  "RUSTSEC-2024-0420", # gdkx11-sys
  # Unmaintained proc-macro ecosystem crates, transitive via build deps.
  "RUSTSEC-2024-0370", # proc-macro-error
  "RUSTSEC-2024-0436", # paste
  # crypto-bigint 0.7.5 was YANKED upstream (RustCrypto pre-release churn; 0.7.4
  # is also yanked, so there is no non-yanked compatible patch). Pulled in via
  # russh 0.61.2 -> p256/p384/p521/elliptic-curve (0.14 release candidates) ->
  # crypto-bigint. russh 0.61.2 is the latest release and pins this rc crypto
  # stack, so we cannot upgrade away from it. Tolerate the yanked status until
  # upstream ships a non-yanked crypto-bigint or russh updates; re-evaluate on
  # every russh upgrade. This suppresses ONLY the yanked check for this exact
  # crate+version — a real advisory against it would still fail CI.
  { crate = "crypto-bigint@0.7.5", reason = "yanked upstream; no non-yanked compatible version exists; pinned transitively via russh 0.61.2 rc crypto stack" },
]

[bans]
# Duplicate versions of the same crate are bloat, not a correctness bug — warn
# (a transitive diamond is usually out of our hands). Wildcard version reqs are
# non-reproducible and forbidden.
multiple-versions = "warn"
wildcards = "deny"
allow = []
deny = []

[licenses]
version = 2
# Permissive + weak-copyleft (MPL) licenses acceptable for a distributed,
# source-available desktop app. A dependency under any other license fails CI;
# resolve by dropping the crate or adding a per-crate `exceptions` entry with a
# justification, not by widening this list reflexively.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "CC0-1.0",
  "BSL-1.0",
  "Unlicense",
  "OpenSSL",
  # webpki-root-certs ships the Mozilla CA bundle under a permissive data license
  # (pulled in via reqwest -> rustls-platform-verifier).
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
exceptions = [
  # Lucerna itself is GPL-3.0-or-later. The allowlist above governs DEPENDENCY
  # licenses; this scoped exception permits our own crate's copyleft license
  # without admitting GPL-licensed dependencies.
  { allow = ["GPL-3.0-or-later"], crate = "lucerna" },
]

[sources]
# Crates must come from crates.io; an unknown registry or git source fails CI.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
