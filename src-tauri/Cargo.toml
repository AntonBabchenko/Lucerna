[package]
name = "lucerna"
version = "0.21.0"
description = "Lucerna - a clean, transparent open-source Minecraft launcher for Windows. No telemetry, no ad injection, no hidden processes, no bundled adware."
authors = ["AntonBabchenko"]
license = "GPL-3.0-or-later"
edition = "2021"
# Single binary: the launcher (`lucerna`, from src/main.rs). The dev-only IPC
# bindings regen is a flag on this same binary — `cargo run -- --export-bindings`
# (see `run()` in src/lib.rs) — not a second `[[bin]]`, because a second package
# binary makes `tauri build` abort bundling on every platform.

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lucerna_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
# Native file-picker dialog used by the modpack import dropzone (v0.5.0 sub-4).
# JS side is `@tauri-apps/plugin-dialog`.
tauri-plugin-dialog = "2"
# Single-instance guard: a second launch of Lucerna focuses the running window
# instead of starting a second process. Official Tauri plugin (same org/version
# train as the others), MIT/Apache-2.0 from crates.io — passes cargo-deny with
# no allowlist change. On Windows it uses a named pipe via the already-present
# windows-sys; no new license class and effectively no new compiled bytes.
tauri-plugin-single-instance = "2"
# Copy a screenshot image to the OS clipboard (screenshots viewer, local-only
# sharing). Official Tauri plugin, same version train as the others,
# MIT/Apache-2.0 from crates.io — passes cargo-deny with no allowlist change.
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Mod descriptors (`META-INF/mods.toml`) are TOML. Already in the runtime tree
# via tauri-utils / tauri-plugin-fs, so this declaration unifies an existing
# version rather than adding a crate to the binary.
toml = "1.1"
specta-typescript = "0.0.12"
specta = { version = "2.0.0-rc.25", default-features = false, features = ["function", "derive"] }
tauri-specta = { version = "2.0.0-rc.25", features = ["derive", "typescript"] }
thiserror = "2.0.18"
sha1 = "0.11.0"
hex = "0.4.3"
reqwest = { version = "0.13.3", default-features = false, features = ["rustls", "json", "stream"] }
futures-util = { version = "0.3.32", default-features = false, features = ["std"] }
# `net` is required by the OAuth loopback listener and the consented-dial tier
# (`network::consent`). `sync` is required by the AI translation pre-fill, whose
# runner bounds provider concurrency with a `Semaphore` (unknown hosts get an
# effectively unlimited throttle bucket, so the bound has to be ours). Both used
# to arrive only through feature unification with reqwest/tauri; listing them
# explicitly keeps a dependency change from silently breaking the build. Same
# crate, no new transitive tree.
tokio = { version = "1.52.3", features = ["fs", "io-util", "net", "process", "rt", "rt-multi-thread", "macros", "sync", "time"] }
# url 2.5: RFC 3986 URL parsing for the host-allowlist check on mrpack downloads[]
url = "2.5"
uuid = { version = "1.23.1", features = ["v4"] }
# md5 verification of ATLauncher-supplied mod digests (RustCrypto `Digest`,
# same trait family as `sha1`). Integrity-matching only — never a security decision.
md-5 = "0.11.0"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
quick-xml = { version = "0.41", default-features = false, features = ["serialize"] }
# NBT (de)serialization for the per-instance `servers.dat` saved-server list.
# servers.dat is UNCOMPRESSED NBT, so fastnbt's from_bytes/to_bytes apply
# directly (no gzip layer). Used only by the local-file `servers::` module.
fastnbt = "2"
async-recursion = "1.1.1"
xz2 = "0.1"
async-trait = "0.1.83"
chrono = { version = "0.4.39", default-features = false, features = ["serde", "clock"] }
# Pattern-matching for the crash log diagnoser (logs/diagnose). Already
# present transitively via reqwest/tracing; promoting to direct adds
# zero new compiled bytes — only declares the dep our module imports.
regex = { version = "1.12", default-features = false, features = ["std", "perf"] }
once_cell = "1.21"
keyring = { version = "3.6.2", features = ["windows-native"] }
# dunce 1.0: Windows-friendly path canonicalisation (no \\?\ prefix) for zip-slip protection
dunce = "1.0"
# v0.2.0 Slice B (revived as cluster C) — Microsoft authentication chain.
# `keyring` and `hex` are already direct deps above and are reused here.
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
urlencoding = "2.1"
# Render mod/modpack descriptions to safe HTML for the detail modals.
# pulldown-cmark: Modrinth bodies are CommonMark. ammonia: allowlist HTML
# sanitizer (used by crates.io itself) — the trust boundary for all
# externally-authored HTML reaching the webview. Both MIT-licensed.
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
ammonia = "4"
# In-app cosign keyless verification of the self-update installer (see
# update::verify). Modular sigstore-rs crate; embedded offline trust root,
# no network. cargo-deny justification: ~37 transitive crates, all the
# RustCrypto + sigstore-rs subtree (der/spki/x509-cert/p256/sha2/rustls-pki),
# largely overlapping the existing reqwest-rustls tree; no new license class.
sigstore-verify = "0.8.0"
# Read-only access to Modrinth App's profile metadata (game version, loader)
# which lives only in its SQLite `app.db` (WAL mode — a hand-rolled parser
# would read stale frames, so a real driver is required). Opened
# SQLITE_OPEN_READ_ONLY by the Modrinth import reader. cargo-deny
# justification: rusqlite is mature and widely used; `bundled` compiles
# SQLite from vendored C source (CI runners have a C toolchain), so there is
# no system-sqlite dependency. License MIT.
rusqlite = { version = "0.32", features = ["bundled"] }
russh = { version = "0.61.2", default-features = false, features = ["aws-lc-rs", "flate2"] }
russh-sftp = "2.3.0"
# Screenshot viewer: decode PNG + downscale to cached JPEG thumbnails/previews
# (thumb::render_data_url). default-features=false keeps only PNG decode + JPEG
# encode — the only formats we touch — to minimise the transitive dep surface.
# cargo-deny justification: MIT/Apache-2.0; pure-Rust codecs, no system libs.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Screenshot viewer: move deleted screenshots to the OS recycle bin (reversible)
# instead of unlink. cargo-deny justification: `trash` is MIT/Apache-2.0; on
# Windows it uses the already-present windows-sys shell APIs — no new license class.
trash = "5"

# Windows-only: WaitForInputIdle to detect when the spawned MC process has
# created its window before we hide the launcher to the tray. Used from
# `platform::wait_for_window_ready` (cfg(windows)); the crate is absent on
# the Linux/macOS builds so the lib compiles there too.
#
# `Win32_Globalization` (GetACP + WideCharToMultiByte) backs
# `platform::path_launchable`: the Windows JVM launcher decodes argv through the
# system ANSI code page, so we ask Windows itself whether an instance path
# survives that conversion instead of guessing. Feature flag on a crate already
# in the tree — no new dependency and no new license class.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Threading", "Win32_Foundation", "Win32_System_SystemInformation", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_Globalization"] }
# Windows `.lnk` writing for desktop launch shortcuts (`shortcuts::create`).
# Pure Rust, in-process. The alternatives were hand-written IShellLink COM
# vtable calls through windows-sys (raw bindings make COM painful, and the
# ergonomic `windows` crate is a far larger dep), or shelling out to
# powershell's WScript.Shell — and a launcher whose selling point is "no hidden
# processes" should not spawn a shell to write a file that has a pure-Rust
# answer. cargo-deny justification: MIT; its three deps (bitflags, byteorder,
# log) are already in the tree transitively, so no new license class and
# effectively no new compiled bytes. The .lnk format is frozen (MS-SHLLINK),
# which is why a crate last released in 2022 is the right kind of stable here.
mslnk = "0.1.8"

# Unix-only: POSIX kill(2) to terminate the Minecraft JVM on Linux/macOS.
# (Windows terminates the process tree via the `process::` taskkill
# chokepoint; the Unix signal path lives in `platform::`.) cargo-deny
# justification: `libc` is a foundational, ubiquitous crate already present
# transitively via tokio/reqwest — promoting it to a direct unix-only dep
# adds zero new compiled bytes and no new license class (MIT OR Apache-2.0).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["full", "test-util"] }
wiremock = "0.6.5"

[profile.dev]
# Local disk is the bottleneck during test/dev builds on the maintainer's
# machine, not CPU. The default `debug = 2` emits full variable/type debug info
# (large .pdb and debug sections on Windows) that bloats the target dir and adds
# disk writes on every link. `debug = 1` keeps line tables — panic backtraces
# still resolve to file:line — while writing far less. The `test` profile
# inherits this, so `cargo test` build artifacts shrink too.
debug = 1

