[package]
name = "ftlauncher"
version = "0.1.0"
description = "Free Tauri Launcher — a clean, transparent open-source Minecraft launcher for Windows. No telemetry, no ad injection, no hidden processes, no bundled adware."
authors = ["AntonBabchenko"]
license = "GPL-3.0-or-later"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ftlauncher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# Native file-picker dialog used by the modpack import dropzone (v0.5.0 sub-4).
# JS side is `@tauri-apps/plugin-dialog`.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta-typescript = "0.0.12"
specta = { version = "2.0.0-rc.25", default-features = false, features = ["function", "derive"] }
tauri-specta = { version = "2.0.0-rc.25", features = ["derive", "typescript"] }
thiserror = "2.0.18"
sha1 = "0.11.0"
hex = "0.4.3"
reqwest = { version = "0.13.3", default-features = false, features = ["rustls", "json", "stream"] }
futures-util = { version = "0.3.32", default-features = false, features = ["std"] }
tokio = { version = "1.52.3", features = ["fs", "io-util", "process", "rt", "rt-multi-thread", "macros"] }
# url 2.5: RFC 3986 URL parsing for the host-allowlist check on mrpack downloads[]
url = "2.5"
uuid = { version = "1.23.1", features = ["v4"] }
md-5 = "0.11.0"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
quick-xml = { version = "0.32", default-features = false, features = ["serialize"] }
async-recursion = "1.1.1"
noak = "0.4"
xz2 = "0.1"
async-trait = "0.1.83"
chrono = { version = "0.4.39", default-features = false, features = ["serde", "clock"] }
keyring = { version = "3.6.2", features = ["windows-native"] }
# dunce 1.0: Windows-friendly path canonicalisation (no \\?\ prefix) for zip-slip protection
dunce = "1.0"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["full"] }
wiremock = "0.6.5"

