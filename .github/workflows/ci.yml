name: CI

# Auto-triggers (push to main, pull_request to main) DISABLED
# 2026-05-30 because the private-repo Actions free-tier quota was exhausted
# mid-month — every job was failing in 3 seconds at the runner-pool layer
# (steps: [], runner_id: 0) regardless of code state. Local gates
# (`pnpm test`, `cargo test --lib`, `pnpm lint`, `pnpm typecheck`) remain
# the source of truth in the meantime; PR reviewers can confirm them
# manually from the commit history.
#
# To re-enable: uncomment the `push` and `pull_request` blocks below. Do
# this either after the monthly quota resets (Actions billing dashboard
# at https://github.com/settings/billing/summary) OR after one of:
# (a) upgrading to a paid plan with more Actions minutes,
# (b) making the repo public (Actions minutes are free on public repos),
# (c) wiring a self-hosted runner so we don't consume GH-hosted minutes.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-ubuntu:
    name: rust (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Install Tauri Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            build-essential
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable @ 2026-05-23
        with:
          toolchain: stable
          components: rustfmt
      - name: Cache cargo
        uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab  # v2.7.5
        with:
          workspaces: src-tauri
      - name: cargo fmt --check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  rust-windows:
    name: rust (windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable @ 2026-05-23
        with:
          toolchain: stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab  # v2.7.5
        with:
          workspaces: src-tauri
      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Install pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2  # v4.0.0
      - name: Install Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: pnpm typecheck
        run: pnpm typecheck
      - name: pnpm test
        run: pnpm test

  # Playwright e2e + visual snapshots. Kept in a SEPARATE job from
  # `frontend` because the visual specs are Linux-pinned and currently
  # baseline-less — they will fail until cluster F runs `--update-snapshots`
  # and commits the PNGs. `continue-on-error: true` on the run step keeps
  # this job from blocking required gates (typecheck + vitest + rust)
  # while the baselines are being seeded. Remove the `continue-on-error`
  # once baselines land.
  visual-e2e:
    name: visual-e2e (non-blocking)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Install pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2  # v4.0.0
      - name: Install Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: pnpm test:e2e
        id: e2e
        continue-on-error: true
        run: pnpm test:e2e
      - name: Upload Playwright report on failure
        if: steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Install pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2  # v4.0.0
      - name: Install Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: pnpm lint
        run: pnpm lint
