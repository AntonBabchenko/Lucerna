name: CI

# Runs on every push and PR to main. GitHub-hosted Actions minutes are free on
# public repositories. `workflow_dispatch` is kept for manual runs (e.g. the
# gated coverage job below).
#
# Per-PR cost control: a `changes` job classifies the diff (rust / frontend /
# bundle) and the heavy jobs are guarded with `if:` so a single-sided PR skips
# the irrelevant half. A push to main (or a manual dispatch) always runs the
# full matrix. The `ci-gate` aggregator at the bottom is the ONLY required
# status check — it passes when every upstream job either succeeded or was
# skipped, so path-filtered skips never wedge a "required check" as pending.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Classify the PR diff so the heavy jobs below can skip the irrelevant half.
  # Native git diff against the PR base — no third-party action, keeping the
  # SHA-pinning supply-chain policy intact. On push/dispatch everything is
  # forced true (full matrix post-merge + on demand).
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
      frontend: ${{ steps.classify.outputs.frontend }}
      bundle: ${{ steps.classify.outputs.bundle }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: classify
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Non-PR event (${{ github.event_name }}) — running the full matrix."
            echo "rust=true" >>"$GITHUB_OUTPUT"
            echo "frontend=true" >>"$GITHUB_OUTPUT"
            echo "bundle=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          base='${{ github.event.pull_request.base.sha }}'
          files=$(git diff --name-only "$base" HEAD)
          echo "Changed files:"; echo "$files"
          rust=false
          frontend=false
          # A workflow change re-runs everything (both flags) so CI can't drift.
          if echo "$files" | grep -qE '^(src-tauri/|Cargo\.(toml|lock)|deny\.toml|\.github/workflows/ci\.yml)'; then
            rust=true
          fi
          if echo "$files" | grep -qE '^(src/|tests/|tests-e2e/|static/|tools/|package\.json|pnpm-lock\.yaml|vitest\.config\.|.*\.config\.(ts|js|mjs)|\.github/workflows/ci\.yml)'; then
            frontend=true
          fi
          # The bundle smoke builds the whole app, so any code change can break
          # it — run it when either half changed.
          bundle=false
          if [ "$rust" = true ] || [ "$frontend" = true ]; then bundle=true; fi
          echo "rust=$rust frontend=$frontend bundle=$bundle"
          echo "rust=$rust" >>"$GITHUB_OUTPUT"
          echo "frontend=$frontend" >>"$GITHUB_OUTPUT"
          echo "bundle=$bundle" >>"$GITHUB_OUTPUT"

  rust-ubuntu:
    name: rust (ubuntu)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Install Tauri Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            build-essential
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable @ 2026-05-23
        with:
          toolchain: stable
          components: rustfmt
      - name: Cache cargo
        uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab  # v2.7.5
        with:
          workspaces: src-tauri
      - name: cargo fmt --check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  rust-windows:
    name: rust (windows)
    runs-on: windows-latest
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable @ 2026-05-23
        with:
          toolchain: stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab  # v2.7.5
        with:
          workspaces: src-tauri
      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  rust-macos:
    name: rust (macos)
    runs-on: macos-latest
    needs: changes
    # cargo test + the macOS bundle smoke — run on any code change (bundle).
    if: ${{ needs.changes.outputs.bundle == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      # No rustfmt component: the fmt --check gate runs on the ubuntu leg only.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable @ 2026-05-23
        with:
          toolchain: stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab  # v2.7.5
        with:
          workspaces: src-tauri
      # No apt-style system deps: macOS uses the system WKWebView (unlike
      # Linux's webkit2gtk). cargo test runs the #[cfg(unix)] platform tests
      # (set_executable, symlink, killpg_target, positive_pid) and the
      # #[cfg(not(windows))] wait_for_window_ready no-op on a real Mac for the
      # first time — that IS the new coverage signal.
      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Install pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2  # v4.0.0
      - name: Install Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Single-arch bundle smoke (host = arm64 on macos-latest). The Universal2
      # build lives in release.yml; here we only prove the macOS bundler runs
      # and emits a .app + .dmg. The smoke bundle is NOT signed or launched.
      - name: Build macOS bundle (smoke)
        run: pnpm tauri build
      - name: Assert .app and .dmg were produced
        run: |
          set -e
          bundle=src-tauri/target/release/bundle
          ls -d "$bundle/macos/"*.app
          ls "$bundle/dmg/"*.dmg
          echo "macOS bundle present."

  linux-bundle:
    name: linux bundle (smoke)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.bundle == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Install pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2  # v4.0.0
      - name: Install Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install Tauri Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            build-essential \
            libxdo-dev \
            file \
            rpm
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable @ 2026-05-23
        with:
          toolchain: stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab  # v2.7.5
        with:
          workspaces: src-tauri
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Linux bundles
        run: pnpm tauri build
      - name: Assert AppImage/deb/rpm were produced
        run: |
          set -e
          bundle=src-tauri/target/release/bundle
          ls "$bundle/appimage/"*.AppImage
          ls "$bundle/deb/"*.deb
          ls "$bundle/rpm/"*.rpm
          echo "Linux bundles present."

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Install pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2  # v4.0.0
      - name: Install Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: pnpm typecheck
        run: pnpm typecheck
      - name: i18n keys up to date
        run: pnpm i18n:keys:check
      - name: pnpm test
        run: pnpm test

  # Playwright visual-snapshot job is DISABLED until baselines are seeded.
  # The visual specs are Linux-pinned and baseline-less; running them produced
  # a perpetual non-green check on the public repo. The e2e specs still run
  # locally via `pnpm test:e2e`. To re-enable: seed PNG baselines with
  # `pnpm test:e2e --update-snapshots`, commit them, and restore a `visual-e2e`
  # job here (Checkout → pnpm/Node setup → install → playwright install → test:e2e).

  lint:
    name: lint
    runs-on: ubuntu-latest
    # Cheap (~20s) and cross-cutting — left ungated so it runs on every PR.
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Install pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2  # v4.0.0
      - name: Install Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: pnpm lint
        run: pnpm lint

  # Coverage gate. Enforces the ratchet floors. Frontend thresholds
  # live in vitest.config.ts; the Rust floor is passed explicitly below.
  # Frontend coverage is cheap (vitest, ~2 min) so it runs on every push/PR as
  # a real per-PR gate — `pnpm test:coverage` fails under the vitest.config.ts
  # thresholds. This is the half of the old manual `coverage` job that has no
  # build cost, promoted to a per-PR check (review: "coverage gate off-PR").
  coverage-frontend:
    name: coverage (frontend)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Install pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2  # v4.0.0
      - name: Install Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: Frontend coverage (gated by vitest.config.ts thresholds)
        run: pnpm test:coverage

  # Rust coverage stays heavy (Tauri build under llvm-cov + single-threaded test
  # run, ~15-20 min — single-threaded to defeat the process-global env-var race,
  # audit finding F2 / backlog E6-env-race). Running it on EVERY PR would add
  # ~20 min to each, so it runs on push-to-main and manual dispatch but NOT on
  # PRs. It is intentionally NOT part of the ci-gate (which gates PR merge), so
  # the long run never blocks a merge — it's a post-merge signal on main.
  coverage-rust:
    name: coverage (rust)
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Install Tauri Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            build-essential
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable @ 2026-05-23
        with:
          toolchain: stable
          components: llvm-tools-preview
      - name: Cache cargo
        uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab  # v2.7.5
        with:
          workspaces: src-tauri
      - name: Install cargo-llvm-cov
        # Plain `cargo install` (not a third-party action) keeps the
        # SHA-pinning supply-chain policy intact — no new unpinned action.
        # Version-pinned so CI output/flags stay reproducible run-to-run.
        run: cargo install cargo-llvm-cov --version 0.8.7 --locked
      - name: Rust coverage (gated, single-threaded)
        run: >-
          cargo llvm-cov --manifest-path src-tauri/Cargo.toml
          --summary-only --fail-under-lines 70 -- --test-threads=1

  # Supply-chain gate: advisories (RustSec DB — the cargo-audit equivalent),
  # banned/duplicate crates, license policy, and source allowlist. Cheap
  # (metadata + advisory DB, no project build) and left ungated so it runs on
  # every PR — the advisory DB drifts even when Cargo.lock does not, so a stale
  # dep can newly trip it. Enforces the CLAUDE.md "no new crate without
  # cargo-deny justification" rule mechanically.
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable @ 2026-05-23
        with:
          toolchain: stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab  # v2.7.5
        with:
          workspaces: src-tauri
      - name: Install cargo-deny
        # Plain version-pinned `cargo install` — same SHA-pinning-friendly
        # policy as cargo-llvm-cov above (no new unpinned marketplace action).
        # 0.19.x is required: older releases fail to PARSE the current RustSec
        # advisory DB (newer entries carry CVSS 4.0 vectors).
        run: cargo install cargo-deny --version 0.19.8 --locked
      - name: cargo deny check
        run: cargo deny --manifest-path src-tauri/Cargo.toml check

  # The single required status check (set in the repo ruleset). Always runs,
  # depends on every PR-relevant job, and fails iff one of them FAILED or was
  # CANCELLED. A `skipped` upstream (path-filtered out) counts as OK, so
  # single-sided PRs are not wedged on a forever-pending required check. Auto-
  # merge waits on this one check, then merges with no human in the loop.
  ci-gate:
    name: ci-gate
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - rust-ubuntu
      - rust-windows
      - rust-macos
      - linux-bundle
      - frontend
      - lint
      - coverage-frontend
      - cargo-deny
    steps:
      - name: Verify no required job failed
        run: |
          set -eu
          results='${{ join(needs.*.result, ' ') }}'
          echo "Upstream job results: $results"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A required CI job did not pass (result: $r)."
              exit 1
            fi
          done
          echo "All required jobs succeeded or were skipped — gate green."
