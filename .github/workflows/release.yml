name: Release

# Builds and publishes a GitHub Release for every pushed v* tag.
# Tags containing "-rc" (e.g. v0.9.0-rc.1) publish as a prerelease — used to
# validate this workflow before the real tag. GitHub-hosted runner minutes are
# free on public repositories. Third-party actions are SHA-pinned (SECURITY.md
# A.7); cosign and cargo-cyclonedx are installed via plain package managers to
# avoid adding new pinned actions (same rationale as cargo-llvm-cov in ci.yml).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the Release and upload assets
  id-token: write   # cosign keyless signing via sigstore OIDC

jobs:
  release:
    name: build + sign + publish
    runs-on: windows-latest
    # The tag is passed via env (not interpolated into run blocks) so a crafted
    # ref cannot break out of the pwsh scripts — GitHub Actions script-injection
    # hardening. Reference it as $env:TAG inside steps.
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2  # v4.0.0

      - name: Install Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable @ 2026-05-23
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab  # v2.7.5
        with:
          workspaces: src-tauri

      - name: Verify tag matches manifest version
        shell: pwsh
        run: |
          $tag = $env:TAG                            # e.g. v0.9.0 or v0.9.0-rc.1
          $base = $tag -replace '^v', '' -replace '-rc\.\d+$', ''
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ($conf.version -ne $base) {
            Write-Error "Tag base '$base' (from '$tag') != tauri.conf.json version '$($conf.version)'"
            exit 1
          }
          Write-Host "Version match OK: $base"
          "APP_VERSION=$($conf.version)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build NSIS installer
        shell: pwsh
        env:
          LUCERNA_MS_CLIENT_ID_SECRET: ${{ secrets.LUCERNA_MS_CLIENT_ID }}
        run: |
          if ($env:LUCERNA_MS_CLIENT_ID_SECRET) {
            $env:LUCERNA_MS_CLIENT_ID = $env:LUCERNA_MS_CLIENT_ID_SECRET
            Write-Host "MS client_id: using value from repo secret"
          } else {
            Write-Host "MS client_id: secret unset/empty; using built-in public default"
          }
          pnpm tauri build

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --version 0.5.7 --locked

      - name: Install cosign
        run: choco install cosign --no-progress -y

      - name: Stage release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $installer) { Write-Error "NSIS installer not found"; exit 1 }
          Copy-Item $installer.FullName "dist/$($installer.Name)"
          cargo cyclonedx --manifest-path src-tauri/Cargo.toml --format json
          $sbom = Get-ChildItem src-tauri/*.cdx.json | Select-Object -First 1
          if (-not $sbom) { Write-Error "SBOM not generated"; exit 1 }
          Copy-Item $sbom.FullName "dist/lucerna-$env:APP_VERSION.cdx.json"

      - name: Generate SHA256SUMS
        shell: pwsh
        working-directory: dist
        run: |
          # Materialize the file list and compute every hash BEFORE opening the
          # output handle — globbing into the same dir while Out-File streams to
          # SHA256SUMS would deadlock on the file being written.
          $files = Get-ChildItem -File | Where-Object { $_.Name -ne 'SHA256SUMS' }
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $f.FullName).Hash.ToLower()
            "$hash  $($f.Name)"
          }
          Set-Content -Path SHA256SUMS -Value $lines -Encoding ascii

      - name: Sign artifacts (cosign keyless)
        shell: pwsh
        working-directory: dist
        env:
          COSIGN_YES: "true"
        run: |
          # Materialize the list first so the .cosign.bundle files created in the
          # loop are never re-enumerated mid-stream.
          $files = Get-ChildItem -File | Where-Object { $_.Name -notlike '*.cosign.bundle' }
          foreach ($f in $files) {
            cosign sign-blob $f.Name --bundle "$($f.Name).cosign.bundle"
            if ($LASTEXITCODE -ne 0) { Write-Error "cosign failed on $($f.Name)"; exit 1 }
          }

      - name: Compose release notes
        shell: pwsh
        run: |
          $notes = @"
          Lucerna $env:APP_VERSION — first public release.

          See CHANGELOG.md for the full feature list.

          ## Verifying this release

          Artifacts are signed with cosign (keyless, sigstore) by this repo's GitHub Actions OIDC identity. To verify the installer:

          ``````
          cosign verify-blob \
            --bundle Lucerna_${env:APP_VERSION}_x64-setup.exe.cosign.bundle \
            --certificate-identity-regexp 'https://github.com/AntonBabchenko/Lucerna/.github/workflows/release.yml@.*' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            Lucerna_${env:APP_VERSION}_x64-setup.exe
          ``````

          Checksums are in ``SHA256SUMS``. A CycloneDX SBOM is attached as ``lucerna-$env:APP_VERSION.cdx.json``.

          ## Note on the unsigned binary

          The installer is **not** OS-level (Authenticode) code-signed — no code-signing certificate has been acquired yet, so Windows SmartScreen may warn on first run. Verify authenticity with cosign and SHA256SUMS above. See docs/SECURITY.md.
          "@
          $notes | Out-File -FilePath notes.md -Encoding utf8

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ghArgs = @(
            $env:TAG,
            "--title", "Lucerna $env:TAG",
            "--notes-file", "notes.md"
          )
          if ($env:TAG -match '-rc\.') { $ghArgs += "--prerelease" }
          $ghArgs += (Get-ChildItem dist -File | ForEach-Object { $_.FullName })
          gh release create @ghArgs
