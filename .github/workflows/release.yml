name: Release

# Builds and publishes a GitHub Release for every pushed v* tag, across
# Windows and Linux. Tags containing "-rc" publish as a prerelease. Runner
# minutes are free on public repos. Third-party actions are SHA-pinned
# (SECURITY.md A.7); cosign and cargo-cyclonedx come from plain installers.
#
# Shape: a matrix `build` job produces the unsigned installers per OS and
# uploads them as workflow artifacts; a single `publish` job (Ubuntu) gathers
# them, generates the SBOM + SHA256SUMS, cosign-signs every artifact, and
# creates one Release. Centralizing signing keeps one identity and one
# SHA256SUMS for all platforms.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the Release and upload assets
  id-token: write   # cosign keyless signing via sigstore OIDC

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2  # v4.0.0

      - name: Install Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install Tauri Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            build-essential \
            libxdo-dev \
            file \
            rpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable @ 2026-05-23
        with:
          toolchain: stable

      - name: Add macOS universal targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab  # v2.7.5
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build bundles
        shell: bash
        env:
          LUCERNA_MS_CLIENT_ID_SECRET: ${{ secrets.LUCERNA_MS_CLIENT_ID }}
          # Baked into the binary at compile time via option_env!. Unset/empty
          # (forks without the secret) => resolve_with treats it as absent and
          # the app falls back to a user-entered key. No conditional shell
          # export needed (unlike the MS id) because resolve_with tolerates "".
          LUCERNA_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          # Ad-hoc code signing on macOS. With this set, Tauri runs
          # `codesign -s -` on the .app DURING bundling, so the .dmg it
          # produces already contains a signed app. That is required for an
          # otherwise-unsigned arm64 binary to launch at all (Gatekeeper kills
          # a fully-unsigned arm64 app as "damaged"). Signing the .app AFTER
          # the build would not help — the .dmg would still hold the unsigned
          # copy. This is NOT notarization (no APPLE_ID/APPLE_PASSWORD set), so
          # a downloaded .dmg is still quarantined; see the release notes /
          # docs for the `xattr` workaround. Ignored on Windows/Linux.
          APPLE_SIGNING_IDENTITY: "-"
        run: |
          if [ -n "$LUCERNA_MS_CLIENT_ID_SECRET" ]; then
            export LUCERNA_MS_CLIENT_ID="$LUCERNA_MS_CLIENT_ID_SECRET"
            echo "MS client_id: using value from repo secret"
          else
            echo "MS client_id: secret unset/empty; using built-in public default"
          fi
          # Universal2 (arm64 + x86_64, lipo'd by Tauri) on macOS; host-default
          # bundles elsewhere.
          if [ "$RUNNER_OS" = "macOS" ]; then
            pnpm tauri build --target universal-apple-darwin
          else
            pnpm tauri build
          fi

      - name: Assert app is ad-hoc signed (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          # Guard: APPLE_SIGNING_IDENTITY="-" must have made Tauri ad-hoc sign
          # the .app during bundling. If a future tauri-cli stops honouring it,
          # the build would otherwise ship a .dmg containing an unsigned app
          # that Gatekeeper kills on Apple Silicon — fail here instead.
          app=$(ls -d src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app | head -n1)
          # `codesign --verify` is the parse-free gate: it exits non-zero if the
          # app is not validly signed at all (an ad-hoc signature counts as
          # valid; a fully unsigned app does not).
          codesign --verify --verbose "$app" || {
            echo "ERROR: $app is not validly signed — APPLE_SIGNING_IDENTITY was not honoured by tauri-bundler"
            exit 1
          }
          # And confirm it is ad-hoc (the identity we asked for), not a real
          # Developer ID. Case-insensitive to tolerate codesign output variance.
          codesign -dvv "$app" 2>&1 | grep -qiE "adhoc|ad hoc" || {
            echo "ERROR: $app is signed but not ad-hoc"
            exit 1
          }
          echo "macOS .app is ad-hoc signed: $app"

      - name: Stage installers (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -e
          mkdir -p dist
          cp src-tauri/target/release/bundle/nsis/*-setup.exe dist/

      - name: Stage installers (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e
          mkdir -p dist
          cp src-tauri/target/release/bundle/appimage/*.AppImage dist/
          cp src-tauri/target/release/bundle/deb/*.deb dist/
          cp src-tauri/target/release/bundle/rpm/*.rpm dist/

      - name: Stage installers (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          mkdir -p dist
          # Universal target → bundles live under the target triple dir.
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg dist/

      - name: Upload installers artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: installers-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: sign + publish
    needs: build
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable @ 2026-05-23
        with:
          toolchain: stable

      - name: Verify tag matches manifest version
        shell: bash
        run: |
          set -e
          base="${TAG#v}"            # strip leading v
          base="${base%%-rc.*}"      # strip -rc.N suffix
          conf_version=$(grep -m1 '"version"' src-tauri/tauri.conf.json | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')
          if [ "$conf_version" != "$base" ]; then
            echo "Tag base '$base' (from '$TAG') != tauri.conf.json version '$conf_version'" >&2
            exit 1
          fi
          echo "Version match OK: $base"
          echo "APP_VERSION=$conf_version" >> "$GITHUB_ENV"

      - name: Download all installer artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: artifacts
      - name: Collect installers into dist/
        shell: bash
        run: |
          set -e
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          echo "Staged:"; ls -1 dist

      - name: Generate SBOM
        shell: bash
        run: |
          set -e
          cargo install cargo-cyclonedx --version 0.5.7 --locked
          cargo cyclonedx --manifest-path src-tauri/Cargo.toml --format json
          sbom=$(ls src-tauri/*.cdx.json | head -n1)
          [ -n "$sbom" ] || { echo "SBOM not generated" >&2; exit 1; }
          cp "$sbom" "dist/lucerna-${APP_VERSION}.cdx.json"

      - name: Generate SHA256SUMS
        shell: bash
        working-directory: dist
        run: |
          set -e
          : > SHA256SUMS
          for f in *; do
            [ "$f" = SHA256SUMS ] && continue
            [ -f "$f" ] || continue
            sha256sum "$f" >> SHA256SUMS
          done
          cat SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Sign artifacts (cosign keyless)
        shell: bash
        working-directory: dist
        env:
          COSIGN_YES: "true"
        run: |
          set -e
          for f in *; do
            [ -f "$f" ] || continue
            case "$f" in *.cosign.bundle) continue;; esac
            cosign sign-blob "$f" --bundle "${f}.cosign.bundle"
          done

      - name: Compose release notes
        shell: bash
        run: |
          cat > notes.md <<'NOTES'
          Lucerna ${APP_VERSION}.

          See CHANGELOG.md for the full feature list. This release ships
          Windows (NSIS `-setup.exe`), Linux (`.AppImage`, `.deb`, `.rpm`),
          and macOS (Universal2 `.dmg`, unsigned) artifacts.

          ## Verifying this release

          Every artifact is signed with cosign (keyless, sigstore) by this
          repo's GitHub Actions OIDC identity. To verify any artifact:

          ```
          cosign verify-blob \
            --bundle <artifact>.cosign.bundle \
            --certificate-identity-regexp 'https://github.com/AntonBabchenko/Lucerna/.github/workflows/release.yml@.*' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            <artifact>
          ```

          Checksums are in `SHA256SUMS`. A CycloneDX SBOM is attached as
          `lucerna-${APP_VERSION}.cdx.json`.

          ## Note on unsigned binaries

          Artifacts are **not** OS-level notarized/code-signed (no
          Authenticode, no Apple Developer ID + notarization). Windows
          SmartScreen may warn on first run; click "More info" → "Run
          anyway". The macOS `.dmg` is Universal2 and only **ad-hoc**-signed,
          so Gatekeeper quarantines a freshly downloaded copy — clear it with
          `xattr -dr com.apple.quarantine /Applications/Lucerna.app`, or
          right-click → Open on first launch. Verify any artifact with cosign
          and SHA256SUMS above. See docs/SECURITY.md.
          NOTES
          # Replace the literal ${APP_VERSION} placeholders now that the
          # heredoc is closed and APP_VERSION is in scope.
          sed -i "s/\${APP_VERSION}/${APP_VERSION}/g" notes.md

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          args=("$TAG" --title "Lucerna $TAG" --notes-file notes.md)
          case "$TAG" in *-rc.*) args+=(--prerelease);; esac
          for f in dist/*; do args+=("$f"); done
          gh release create "${args[@]}"
